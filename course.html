        <div class="video-actions">
          <button class="btn btn-primary" id="mark-complete">Mark as complete</button>
          <button class="btn btn-ghost" id="prev-lesson">← Previous</button>
          <button class="btn btn-ghost" id="next-lesson">Next lesson →</button>
        </div>
      </div>
    </div>

    <aside class="sidebar-list">
      <div class="sidebar-list-head">All 25 lessons</div>
