<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Log in — THE FOREX PROGRAM</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>

<div class="auth-shell">
  <div class="auth-visual">
    <a href="index.html" class="brand">
      <span class="brand-mark"></span>
      <span>THE FOREX PROGRAM</span>
    </a>
    <div class="quote">
      "Risk management isn't the boring part of trading. <span>It's the whole game.</span>"
    </div>
    <div class="who">— Lesson 07, Risk Management Fundamentals</div>
  </div>

  <div class="auth-side">
    <div class="auth-card fade-up">
      <h2>Welcome back</h2>
      <p>Log in to pick up where you left off.</p>

      <div id="form-msg" class="form-msg"></div>

      <form id="login-form" novalidate>
        <div class="field">
          <label for="li-email">Email</label>
          <input type="email" id="li-email" name="email" autocomplete="email" required>
        </div>
        <div class="field">
          <label for="li-password">Password</label>
          <input type="password" id="li-password" name="password" autocomplete="current-password" required>
        </div>
        <button type="submit" class="btn btn-primary btn-block">Log in</button>
      </form>

      <div class="auth-switch">New here? <a href="signup.html">Create a free account</a></div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase-client.js"></script>
<script src="js/courses-data.js"></script>
<script src="js/app.js"></script>
</body>
</html>
