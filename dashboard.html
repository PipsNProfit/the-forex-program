<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard — THE FOREX PROGRAM</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>

<nav class="nav">
  <div class="nav-inner">
    <a href="index.html" class="brand">
      <span class="brand-mark"></span>
      <span>THE FOREX PROGRAM<small>MARKET EDUCATION</small></span>
    </a>
    <div class="nav-links">
      <a href="dashboard.html">Dashboard</a>
    </div>
    <div class="nav-actions">
      <button class="theme-toggle" data-theme-toggle aria-label="Toggle light and dark theme"></button>
      <button class="btn btn-ghost btn-sm" data-logout>Log out</button>
    </div>
  </div>
</nav>

<header class="dash-header">
  <div class="container dash-header-inner">
    <div>
      <h1>Welcome back, <span id="dash-name">trader</span>.</h1>
      <p>25 lessons · beginner to advanced · pick up anywhere.</p>
    </div>
    <div class="dash-user">
      <div class="avatar" id="dash-avatar">T</div>
    </div>
  </div>
</header>

<main class="container">
  <div class="overall-progress">
    <span class="mono" style="font-size:13px;color:var(--text-secondary);white-space:nowrap;">Overall progress</span>
    <div class="bar"><span id="overall-bar" style="width:0%"></span></div>
    <span class="pct mono" id="overall-pct">0%</span>
  </div>

  <div class="filters">
    <button class="filter-btn active" data-filter="All">All lessons</button>
    <button class="filter-btn" data-filter="Beginner">Beginner</button>
    <button class="filter-btn" data-filter="Intermediate">Intermediate</button>
    <button class="filter-btn" data-filter="Advanced">Advanced</button>
  </div>

  <div class="course-grid" id="course-grid"></div>
</main>

<footer class="footer" style="margin-top:60px;">
  <div class="container footer-inner">
    <p>© 2026 THE FOREX PROGRAM. Educational content only — not financial advice.</p>
    <div class="footer-links">
      <a href="index.html">Home</a>
    </div>
  </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase-client.js"></script>
<script src="js/courses-data.js"></script>
<script src="js/app.js"></script>
</body>
</html>
